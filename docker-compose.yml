version: "3.8"

services:
  db:
    image: postgres:15
    container_name: drishti_db
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti123
      POSTGRES_DB: drishtidb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: drishti_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: